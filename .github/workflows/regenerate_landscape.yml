name: Regenerate corrected ADK landscape

on:
  push:
    branches: [fix/core-domain-indexing-20261015]
    paths:
      - scripts/regenerate_landscape.py
      - .github/workflows/regenerate_landscape.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-domain-indexing-20261015
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependencies
        run: python -m pip install 'numpy<2' mdtraj matplotlib
      - name: Generate corrected landscape
        run: python scripts/regenerate_landscape.py
      - name: Commit updated figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/free_energy_landscape.png
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate ADK landscape using corrected CORE residues"
            git push
          fi
